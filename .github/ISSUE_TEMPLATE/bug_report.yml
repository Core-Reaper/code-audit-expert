name: 🐛 Bug报告
description: 报告一个Bug帮助我们改进
title: "[Bug] "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢您花时间填写这个Bug报告！
        
  - type: textarea
    id: description
    attributes:
      label: Bug描述
      description: 清晰简洁地描述Bug是什么
      placeholder: 例如：执行审计时出现TypeError
    validations:
      required: true
      
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何复现这个Bug
      placeholder: |
        1. 执行命令 '...'
        2. 点击 '....'
        3. 看到错误
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 您期望发生什么
      placeholder: 清晰简洁地描述您期望的行为
    validations:
      required: true
      
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么
      placeholder: 清晰简洁地描述实际发生的情况
    validations:
      required: true
      
  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 您使用的操作系统
      placeholder: 例如：Windows 11, macOS 13, Ubuntu 22.04
    validations:
      required: true
      
  - type: input
    id: python-version
    attributes:
      label: Python版本
      description: 您使用的Python版本
      placeholder: 例如：3.9.7
    validations:
      required: true
      
  - type: input
    id: skill-version
    attributes:
      label: Skill版本
      description: 您使用的Skill版本
      placeholder: 例如：v3.0.0
    validations:
      required: true
      
  - type: textarea
    id: logs
    attributes:
      label: 相关日志输出
      description: 请复制并粘贴任何相关的日志输出
      render: shell
      
  - type: textarea
    id: additional
    attributes:
      label: 附加上下文
      description: 在此处添加有关问题的任何其他上下文
