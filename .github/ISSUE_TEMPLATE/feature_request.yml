name: ✨ 功能请求
description: 为这个项目提出一个新功能的想法
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢您提出新功能建议！
        
  - type: textarea
    id: problem
    attributes:
      label: 相关问题
      description: 您的功能请求是否与某个问题相关？请描述
      placeholder: 例如：我在审计大型项目时经常遇到...
      
  - type: textarea
    id: solution
    attributes:
      label: 您希望的解决方案
      description: 描述您想要的功能
      placeholder: 清晰简洁地描述您希望发生什么
    validations:
      required: true
      
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 您考虑过哪些替代方案或功能？
      placeholder: 清晰简洁地描述您考虑过的任何替代解决方案或功能
      
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 您认为这个功能的优先级是？
      options:
        - 🔴 高（严重影响使用）
        - 🟡 中（有助于提升体验）
        - 🟢 低（锦上添花）
    validations:
      required: true
      
  - type: textarea
    id: additional
    attributes:
      label: 附加上下文
      description: 在此处添加有关功能请求的任何其他上下文或截图
